    <filter id="paper"><feTurbulence baseFrequency=".42" numOctaves="3" seed="18"/><feColorMatrix values=".3 0 0 0 .25 .2 0 0 0 .15 .15 0 0 0 .12 0 0 0 .18 0"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#5A3231"/>
